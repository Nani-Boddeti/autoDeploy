# Traefik static configuration TEMPLATE for the AutoDeploy host in PUBLIC mode (22-5/22-6).
# NOT installed verbatim: install-app.sh --mode public renders it (render_traefik_static) into
# /etc/autodeploy/traefik/traefik.yml, replacing exactly these placeholder lines/tokens from
# validated flags only (never a raw shell/sed substitution):
#   @ACME_EMAIL_LINE@       -> `email: "<addr>"` (line omitted without --acme-email)
#   @ACME_CA_SERVER@        -> Let's Encrypt production or (--acme-staging) staging directory URL
#   @ACME_CHALLENGE_BLOCK@  -> httpChallenge on entrypoint web (default) or tlsChallenge (--acme-challenge)
# Everything else is a copy of traefik.yml (LAN) so entrypoints, providers and the API stay identical.
# Mounted read-only into the container by autodeploy-traefik.service. Non-secret.
#
# Addresses below are INSIDE the container (it runs on the AutoDeploy environment
# network, not host networking: see autodeploy-traefik.service). The host-side
# bindings are set by the unit's -p options; the management API is published only
# on 127.0.0.1:8080 of the host.
#
# Names that the application code fixes (internal/runtime/traefik/defaults.go):
#   DefaultEntrypointName   = "websecure"
#   DefaultCertResolverName = "letsencrypt-production"
# The renderer emits both into every route file (entryPoints: [websecure],
# tls.certResolver: letsencrypt-production) and the observer requires the loaded
# router to report exactly them. The entrypoint is defined here. The resolver is
# defined below (certificatesResolvers) in this public-mode file.
global:
  checkNewVersion: false
  sendAnonymousUsage: false
  # Drop request headers whose names alias a header Traefik manages (X_Forwarded_For
  # vs X-Forwarded-For): the control plane trusts forwarded headers from this proxy.
  aliasHeadersStrategy: delete

log:
  level: INFO
accessLog: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  # Management API entrypoint. Reached only through the host-side loopback port
  # publication (127.0.0.1:8080). The router that serves it (with basicAuth) lives in
  # the file-provider directory: autodeploy-api.yml.
  traefik:
    address: ":8080"

api:
  # Dashboard off; insecure off (insecure would expose the API without auth).
  dashboard: false
  insecure: false

providers:
  file:
    # The agent's route directory (agent-owned, written atomically by
    # internal/runtime/traefik). It also holds the root-owned, installer-managed
    # files autodeploy-api.yml, autodeploy-controlplane.yml and autodeploy-tls.yml.
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt-production:
    acme:
      # Mounted read-write from /var/lib/autodeploy/traefik/acme (root 0700; acme.json 0600).
      # Holds the ACME account key and certificate keys: back it up.
      storage: /etc/traefik/acme/acme.json
@ACME_EMAIL_LINE@
      caServer: @ACME_CA_SERVER@
@ACME_CHALLENGE_BLOCK@
