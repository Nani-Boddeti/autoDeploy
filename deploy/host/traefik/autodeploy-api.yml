# Traefik dynamic configuration: management API router with basic auth.
# Installed (root:root 0644) by install-app.sh into the agent's route directory,
# which is Traefik's file-provider directory. Non-secret: the bcrypt users file is
# mounted separately and generated by create-credentials.sh.
#
# Exposes only /api (dashboard is off in the static config). The agent's observer
# calls /api/version, /api/http/routers/<name>@file and /api/http/services/<name>@file.
http:
  routers:
    autodeploy-api:
      rule: PathPrefix(`/api`)
      entryPoints:
        - traefik
      service: api@internal
      middlewares:
        - autodeploy-api-auth
  middlewares:
    autodeploy-api-auth:
      basicAuth:
        usersFile: /etc/traefik/secrets/api-users
        realm: autodeploy
        removeHeader: true
