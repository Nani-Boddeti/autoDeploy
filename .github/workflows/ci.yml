name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: autodeploy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d autodeploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - run: gofmt -d .
      - run: go vet ./...
      - run: go test ./...
      - run: go test -p 1 -tags=integration ./internal/store/postgres ./internal/agent/http ./migrations
        env:
          AUTODEPLOY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/autodeploy_test?sslmode=disable
      - run: go build ./...
      # Compile the Linux-only privileged services and production runner for
      # both supported Linux architectures. This is not runtime isolation
      # coverage; that requires an explicitly provisioned host.
      - run: GOOS=linux GOARCH=amd64 go build ./cmd/checkout-quota-service ./cmd/checkout-exec ./internal/gitcheckout
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/checkout-quota-service ./cmd/checkout-exec ./internal/gitcheckout
