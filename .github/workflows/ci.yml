name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: autodeploy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d autodeploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - run: gofmt -d .
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags=integration ./internal/store/postgres ./migrations
        env:
          AUTODEPLOY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/autodeploy_test?sslmode=disable
      - run: go build ./...
