{{template "head" "AutoDeploy first-run setup"}}<main><h1>AutoDeploy first-run setup</h1><p class="hint">Create the administrator. Run <code>autodeploy-run admin setup-token</code> on the host to get the one-time setup code.</p>{{if .Error}}<p class="notice" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/setup"><label>Setup code <input name="code" type="password" autocomplete="off" spellcheck="false" required></label><label>Username <input name="username" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="new-password" minlength="15" required></label><label>Confirm password <input name="confirm" type="password" autocomplete="new-password" minlength="15" required></label><input type="hidden" name="csrf" value="{{.CSRF}}"><button type="submit">Create administrator</button></form></main>{{template "foot"}}
